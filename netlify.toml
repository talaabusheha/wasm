[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_SUPABASE_URL = "https://lcmnabegxmedfunleurr.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_8gUEdTSe7miOKQU0CiikjA_QeG_2J5t"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/designs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
